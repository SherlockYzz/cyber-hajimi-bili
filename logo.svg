<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#4FACFE" />
      <stop offset="100%" stop-color="#6B11FF" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- 背景圆 -->
  <circle cx="50" cy="50" r="46" fill="#0D1117" stroke="url(#cyberGrad)" stroke-width="3" />
  
  <!-- 猫耳朵 -->
  <polygon points="26,38 34,16 45,30" fill="url(#cyberGrad)" filter="url(#neonGlow)" />
  <polygon points="74,38 66,16 55,30" fill="url(#cyberGrad)" filter="url(#neonGlow)" />
  
  <!-- 猫头轮廓 -->
  <path d="M 28 42 C 28 32, 72 32, 72 42 C 78 54, 76 72, 50 78 C 24 72, 22 54, 28 42 Z" fill="#161B22" stroke="url(#cyberGrad)" stroke-width="2.5" />
  
  <!-- 全息天线 -->
  <line x1="50" y1="28" x2="50" y2="12" stroke="#00F2FE" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="50" cy="10" r="3" fill="#00F2FE" filter="url(#neonGlow)" />
  
  <!-- 眼睛 (发光赛博眼) -->
  <ellipse cx="38" cy="48" rx="4.5" ry="6" fill="#00F2FE" filter="url(#neonGlow)" />
  <ellipse cx="62" cy="48" rx="4.5" ry="6" fill="#00F2FE" filter="url(#neonGlow)" />
  
  <!-- 赛博胡须 -->
  <line x1="20" y1="56" x2="32" y2="58" stroke="#4FACFE" stroke-width="1.8" stroke-linecap="round" />
  <line x1="18" y1="64" x2="30" y2="63" stroke="#4FACFE" stroke-width="1.8" stroke-linecap="round" />
  <line x1="80" y1="56" x2="68" y2="58" stroke="#4FACFE" stroke-width="1.8" stroke-linecap="round" />
  <line x1="82" y1="64" x2="70" y2="63" stroke="#4FACFE" stroke-width="1.8" stroke-linecap="round" />
  
  <!-- 嘴巴 / 鼻头 -->
  <polygon points="50,56 48,54 52,54" fill="#FF758C" />
  <path d="M 46 58 Q 50 62 54 58" fill="none" stroke="#FF758C" stroke-width="1.5" stroke-linecap="round" />
</svg>
